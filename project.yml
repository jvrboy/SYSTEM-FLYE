name: SYSTEMFLYE
options:
  bundleIdPrefix: com.jvrboy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    PRODUCT_BUNDLE_IDENTIFIER: com.jvrboy.systemflye
    INFOPLIST_FILE: SYSTEMFLYE/Info.plist
targets:
  SYSTEMFLYE:
    type: application
    platform: iOS
    sources:
      - path: SYSTEMFLYE
        excludes:
          - Resources
          - DashboardView.swift
    resources:
      - path: SYSTEMFLYE/Resources
    preBuildScripts:
      - name: Copy production resources into app bundle
        basedOnDependencyAnalysis: false
        script: |
          set -e
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Resources"
          cp -R "$SRCROOT/SYSTEMFLYE/Resources/." "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Resources/"
    settings:
      base:
        PRODUCT_NAME: SYSTEM FLYE
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      gatherCoverageData: false
      testTargets:
        - SYSTEMFLYETests
  SYSTEMFLYETests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SYSTEMFLYETests
    dependencies:
      - target: SYSTEMFLYE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jvrboy.systemflye.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SYSTEM FLYE.app/SYSTEM FLYE"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  SYSTEMFLYE:
    build:
      targets:
        SYSTEMFLYE: all
        SYSTEMFLYETests: [test]
    test:
      targets:
        - SYSTEMFLYETests
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
